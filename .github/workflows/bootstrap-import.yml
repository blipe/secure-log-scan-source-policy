name: Bootstrap verified source import

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-import-complete
          fetch-depth: 0

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/chunk.* | tr -d '\n' | base64 --decode > /tmp/source.tar.xz
          echo '9584a2d95d70263854a4ae37f79a6af9a1da1320f0c17ba464698d57d3b2674b  /tmp/source.tar.xz' | sha256sum --check
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test "$(find /tmp/source -type f | wc -l)" -eq 99
          test "$(wc -l < /tmp/source/src/main/java/securelogscan/SecureLogScan.java)" -eq 4605
          rm -rf .transfer
          cp -a /tmp/source/. .
          chmod +x build.sh run.sh test.sh test-policy.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      - name: Commit ordinary source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Import secure log scanner source project'
          git push origin HEAD:agent/source-import-complete
