name: Materialize verified source tree

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-import-clean-20260808
          fetch-depth: 0

      - name: Reconstruct and extract source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/chunk.* | tr -d '\n' | base64 --decode > /tmp/source.tar.xz
          echo 'c4d196323d8b1301767c3d58744333a60f6b68c8755345e33033f875a6b0f399  /tmp/source.tar.xz' | sha256sum --check
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test "$(find /tmp/source -type f | wc -l)" -eq 99
          test "$(wc -l < /tmp/source/src/main/java/securelogscan/SecureLogScan.java)" -eq 4605

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -type f ! -name materialize-source.yml -delete

          cp -a /tmp/source/. .
          chmod +x build.sh run.sh test.sh test-policy.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize secure log scanner source"
          git push origin HEAD:refs/heads/agent/source-import-clean-20260808
