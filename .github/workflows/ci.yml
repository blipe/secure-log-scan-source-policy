name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        run: mvn --batch-mode --no-transfer-progress --errors clean package
      - name: Dependency-free build
        run: ./build.sh
      - name: CLI smoke test
        run: ./run.sh --help
