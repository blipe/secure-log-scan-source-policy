name: Maven Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn --version

      - name: Verify Maven Central access
        run: |
          getent ahosts repo.maven.apache.org
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            --output /dev/null \
            --write-out 'HTTP %{http_code} remote=%{remote_ip} time=%{time_total}s\n' \
            https://repo.maven.apache.org/maven2/org/apache/maven/plugins/maven-compiler-plugin/3.14.0/maven-compiler-plugin-3.14.0.pom

      - name: Compile and run complete regression suite
        run: mvn --batch-mode --no-transfer-progress --errors clean verify

      - name: Smoke executable JAR
        run: |
          java \
            --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            --add-exports java.base/jdk.internal.org.objectweb.asm.tree=ALL-UNNAMED \
            --add-exports java.base/jdk.internal.org.objectweb.asm.tree.analysis=ALL-UNNAMED \
            -jar target/secure-log-scan-source-policy-12.0.0-SNAPSHOT.jar --help

      - name: Show build artifacts
        run: find target -maxdepth 2 -type f -print | sort
